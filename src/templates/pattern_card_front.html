<div class="cs-card" id="csCard">
  <div class="card-top-row">
    <div class="badges">
      <span class="badge accent">HSK{{HskLevel}}</span>
      <span class="badge" id="freqBadge"></span>
    </div>
    <button class="badge-toggle" id="btnPinyin" type="button">拼音</button>
  </div>

  <div class="sentence-zh" id="sentenceZh"></div>

  <div class="hints" id="hints"></div>
  <div class="row-controls">
    <button class="pill-btn" id="btnHint1" type="button"></button>
    <button class="pill-btn" id="btnHint2" type="button"></button>
  </div>

  <p class="footline">想一想，空格里缺的是哪个字？</p>
</div>

<script id="cs-breakdown" type="application/json">{{BreakdownJson}}</script>

<script>
(function () {
  const ICONS = {
    bulb: '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2z"/><rect x="10" y="20" width="4" height="2" rx="1"/></svg>',
  };
  const FREQ_LABELS = { top1k: 'Top 1000', top3k: 'Top 3000', top5k: 'Top 5000', top10k: 'Top 10 000', rare: '低频' };

  const HANZI = "{{Hanzi}}";
  const PRIMARY_ZH = "{{PrimaryMeaningZh}}";
  const PRIMARY_ES = "{{PrimaryMeaningEs}}";
  const FREQ_BUCKET = "{{FreqBucket}}";

  const breakdown = JSON.parse(document.getElementById('cs-breakdown').textContent || '[]');
  const targetIndex = breakdown.findIndex(w => w.hanzi === HANZI);

  document.getElementById('freqBadge').textContent = FREQ_LABELS[FREQ_BUCKET] || FREQ_BUCKET;

  let sentencePinyinShown = false;
  let hint1Visible = false;
  let hint2Visible = false;

  const sentenceZh = document.getElementById('sentenceZh');
  const btnPinyin = document.getElementById('btnPinyin');
  const btnHint1 = document.getElementById('btnHint1');
  const btnHint2 = document.getElementById('btnHint2');
  const hintsEl = document.getElementById('hints');

  function renderSentence() {
    // El hueco se ubica por posición en el desglose (no busca-y-reemplaza texto),
    // así un compuesto que contenga el carácter objetivo (ej. 按钮) no se ve afectado.
    // El hueco nunca muestra su pinyin, sin importar el estado del toggle.
    sentenceZh.innerHTML = breakdown.map((w, i) => {
      let body;
      if (i === targetIndex) {
        body = '<span class="blank">' + '＿'.repeat(w.hanzi.length) + '</span>';
      } else {
        body = sentencePinyinShown ? '<ruby>' + w.hanzi + '<rt>' + w.pinyin + '</rt></ruby>' : w.hanzi;
      }
      return '<span class="sb-word" data-i="' + i + '">' + body + '</span>';
    }).join('');
  }

  function renderHints() {
    let html = '';
    if (hint1Visible) html += '<div class="hint-box">' + PRIMARY_ZH + '</div>';
    if (hint2Visible) html += '<div class="hint-box es">' + PRIMARY_ES + '</div>';
    hintsEl.innerHTML = html;
    btnHint1.classList.toggle('on', hint1Visible);
    btnHint2.classList.toggle('on', hint2Visible);
  }

  btnPinyin.addEventListener('click', () => { sentencePinyinShown = !sentencePinyinShown; btnPinyin.classList.toggle('on', sentencePinyinShown); renderSentence(); });
  btnHint1.addEventListener('click', () => { hint1Visible = !hint1Visible; renderHints(); });
  btnHint2.addEventListener('click', () => { hint2Visible = !hint2Visible; renderHints(); });

  btnHint1.innerHTML = ICONS.bulb + ' 提示 1';
  btnHint2.innerHTML = ICONS.bulb + ' 提示 2';

  renderSentence();
  renderHints();
})();
</script>
