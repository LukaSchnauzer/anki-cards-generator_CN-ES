<div class="cs-card" id="csCard">
  <div class="card-top-row">
    <div class="badges">
      <span class="badge accent">HSK{{HskLevel}}</span>
      <span class="badge" id="freqBadge"></span>
    </div>
  </div>

  <div class="spacer-flex"></div>

  <div class="audio-circles">
    <button class="circle-btn circle-big" id="btnNormal" type="button" aria-label="播放"></button>
    <div class="circle-slow-wrap">
      <button class="circle-btn circle-small" id="btnSlow" type="button" aria-label="慢速播放"></button>
      <span class="circle-caption">慢</span>
    </div>
  </div>

  <div class="spacer-flex"></div>

  <div class="hints" id="hints"></div>
  <div class="row-controls">
    <button class="pill-btn" id="btnHint1" type="button">提示 1 · 关键词</button>
    <button class="pill-btn" id="btnHint2" type="button" style="display:none;">提示 2 · 意思</button>
  </div>

  <p class="footline" id="footline">听录音，理解意思</p>
</div>

<audio id="audioNormal" src="{{AudioSentenceNormalFile}}"></audio>
<audio id="audioSlow" src="{{AudioSentenceSlowFile}}"></audio>

<script>
(function () {
  const PLAY_BIG = '<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const PLAY_SMALL = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const FREQ_LABELS = { top1k: 'Top 1000', top3k: 'Top 3000', top5k: 'Top 5000', top10k: 'Top 10 000', rare: '低频' };

  const HANZI = "{{Hanzi}}";
  const PRIMARY_ZH = "{{PrimaryMeaningZh}}";
  const FREQ_BUCKET = "{{FreqBucket}}";

  document.getElementById('freqBadge').textContent = FREQ_LABELS[FREQ_BUCKET] || FREQ_BUCKET;
  document.getElementById('btnNormal').innerHTML = PLAY_BIG;
  document.getElementById('btnSlow').innerHTML = PLAY_SMALL;

  let hint1Revealed = false;
  let hint2Revealed = false;

  const audioNormal = document.getElementById('audioNormal');
  const audioSlow = document.getElementById('audioSlow');
  const btnNormal = document.getElementById('btnNormal');
  const btnSlow = document.getElementById('btnSlow');
  const hintsEl = document.getElementById('hints');
  const btnHint1 = document.getElementById('btnHint1');
  const btnHint2 = document.getElementById('btnHint2');
  const footline = document.getElementById('footline');

  [audioNormal, audioSlow].forEach((a, idx) => {
    const circle = idx === 0 ? btnNormal : btnSlow;
    a.addEventListener('play', () => {
      [audioNormal, audioSlow].forEach(other => { if (other !== a && !other.paused) other.pause(); });
      circle.classList.add('is-playing');
    });
    a.addEventListener('pause', () => circle.classList.remove('is-playing'));
    a.addEventListener('ended', () => circle.classList.remove('is-playing'));
  });

  btnNormal.addEventListener('click', () => { audioNormal.currentTime = 0; audioNormal.play(); });
  btnSlow.addEventListener('click', () => { audioSlow.currentTime = 0; audioSlow.play(); });

  function renderHints() {
    let html = '';
    if (hint1Revealed) html += '<div class="target-reveal">' + HANZI + '</div>';
    if (hint2Revealed) html += '<div class="hint-box">' + PRIMARY_ZH + '</div>';
    hintsEl.innerHTML = html;
    btnHint1.classList.toggle('on', hint1Revealed);
    btnHint2.classList.toggle('on', hint2Revealed);
    btnHint2.style.display = hint1Revealed ? 'inline-flex' : 'none';
    footline.innerHTML = hint1Revealed
      ? '这句话里 <b style="color:var(--accent)">' + HANZI + '</b> 是什么意思？'
      : '听录音，理解意思';
  }

  btnHint1.addEventListener('click', () => {
    hint1Revealed = !hint1Revealed;
    if (!hint1Revealed) hint2Revealed = false; // ocultar la 1 oculta también la 2, que depende de ella
    renderHints();
  });
  btnHint2.addEventListener('click', () => { hint2Revealed = !hint2Revealed; renderHints(); });

  renderHints();
})();
</script>
