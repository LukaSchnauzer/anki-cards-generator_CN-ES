<div class="cs-card" id="csCard">
  <div class="card-top-row">
    <div class="badges">
      <span class="badge accent">HSK{{HskLevel}}</span>
      <span class="badge" id="freqBadge"></span>
    </div>
    <button class="badge-toggle" id="btnPinyin" type="button">拼音</button>
  </div>

  <div class="sentence-zh" id="sentenceZh"></div>

  <div class="row-controls">
    <button class="pill-btn" id="btnWord" type="button"></button>
    <button class="pill-btn" id="btnSentence" type="button"></button>
  </div>

  <div class="hints" id="hints"></div>
  <div class="row-controls">
    <button class="pill-btn" id="btnHint" type="button"></button>
  </div>

  <p class="footline">这句话里 <b style="color:var(--accent)">{{Hanzi}}</b> 是什么意思？</p>
</div>

<audio id="audioWord" src="{{AudioWordFile}}"></audio>
<audio id="audioSentence" src="{{AudioSentenceFile}}"></audio>

<script id="cs-breakdown" type="application/json">{{BreakdownJson}}</script>
<script id="cs-alignment" type="application/json">{{SentenceAlignmentJson}}</script>

<script>
(function () {
  const ICONS = {
    speaker: '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v8.06c1.5-.74 2.5-2.26 2.5-4.03z"/></svg>',
    bulb: '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2z"/><rect x="10" y="20" width="4" height="2" rx="1"/></svg>',
  };
  const FREQ_LABELS = { top1k: 'Top 1000', top3k: 'Top 3000', top5k: 'Top 5000', top10k: 'Top 10 000', rare: '低频' };

  const HANZI = "{{Hanzi}}";
  const PRIMARY_ZH = "{{PrimaryMeaningZh}}";
  const FREQ_BUCKET = "{{FreqBucket}}";

  const breakdown = JSON.parse(document.getElementById('cs-breakdown').textContent || '[]');
  const alignment = JSON.parse(document.getElementById('cs-alignment').textContent || 'null');
  const targetIndex = breakdown.findIndex(w => w.hanzi === HANZI);

  // Agrupa la alineación por carácter de ElevenLabs en ventanas de tiempo por
  // palabra/token del desglose (mismo criterio que en el prototipo validado).
  function buildWordTimings() {
    if (!alignment) return breakdown.map(() => ({ start: 0, end: 0 }));
    const starts = alignment.character_start_times_seconds;
    const ends = alignment.character_end_times_seconds;
    let charIdx = 0;
    return breakdown.map(w => {
      const len = w.hanzi.length;
      const s = starts[charIdx];
      const e = ends[Math.min(charIdx + len - 1, ends.length - 1)];
      charIdx += len;
      return { start: s, end: e };
    });
  }
  const timings = buildWordTimings();

  document.getElementById('freqBadge').textContent = FREQ_LABELS[FREQ_BUCKET] || FREQ_BUCKET;
  document.getElementById('btnWord').innerHTML = ICONS.speaker + ' 词';
  document.getElementById('btnSentence').innerHTML = ICONS.speaker + ' 句子';

  let sentencePinyinShown = false;
  let hintVisible = false;
  let rafId = null;

  const sentenceZh = document.getElementById('sentenceZh');
  const btnPinyin = document.getElementById('btnPinyin');
  const btnHint = document.getElementById('btnHint');
  const hintsEl = document.getElementById('hints');
  const audioWord = document.getElementById('audioWord');
  const audioSentence = document.getElementById('audioSentence');

  function renderSentence() {
    sentenceZh.innerHTML = breakdown.map((w, i) => {
      const body = sentencePinyinShown ? '<ruby>' + w.hanzi + '<rt>' + w.pinyin + '</rt></ruby>' : w.hanzi;
      const inner = i === targetIndex ? '<span class="tgt">' + body + '</span>' : body;
      return '<span class="sb-word" data-i="' + i + '">' + inner + '</span>';
    }).join('');
  }

  function renderHint() {
    hintsEl.innerHTML = hintVisible ? '<div class="hint-box">' + PRIMARY_ZH + '</div>' : '';
    btnHint.classList.toggle('on', hintVisible);
  }

  function indexAtTime(t) {
    for (let i = 0; i < timings.length; i++) {
      if (t >= timings[i].start && t < timings[i].end) return i;
    }
    return -1;
  }

  function setPlayingIndex(index) {
    document.querySelectorAll('.sb-word').forEach(el => {
      el.classList.toggle('is-playing', Number(el.dataset.i) === index);
    });
  }

  function syncTick() {
    setPlayingIndex(indexAtTime(audioSentence.currentTime));
    rafId = requestAnimationFrame(syncTick);
  }

  audioSentence.addEventListener('play', () => { if (rafId === null) rafId = requestAnimationFrame(syncTick); });
  audioSentence.addEventListener('pause', () => { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } setPlayingIndex(-1); });
  audioSentence.addEventListener('ended', () => { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } setPlayingIndex(-1); });

  function setWordAudioPlaying(on) {
    document.querySelectorAll('.sb-word[data-i="' + targetIndex + '"]').forEach(el => el.classList.toggle('is-playing', on));
  }
  audioWord.addEventListener('play', () => setWordAudioPlaying(true));
  audioWord.addEventListener('pause', () => setWordAudioPlaying(false));
  audioWord.addEventListener('ended', () => setWordAudioPlaying(false));

  document.getElementById('btnWord').addEventListener('click', () => { audioWord.currentTime = 0; audioWord.play(); });
  document.getElementById('btnSentence').addEventListener('click', () => { audioSentence.currentTime = 0; audioSentence.play(); });
  btnPinyin.addEventListener('click', () => { sentencePinyinShown = !sentencePinyinShown; btnPinyin.classList.toggle('on', sentencePinyinShown); renderSentence(); });
  btnHint.addEventListener('click', () => { hintVisible = !hintVisible; renderHint(); });

  btnHint.innerHTML = ICONS.bulb + ' 提示';
  renderSentence();
  renderHint();
})();
</script>
